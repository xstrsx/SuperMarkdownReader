# LiteDoc Gradle configuration.
#
# Configuration cache is intentionally NOT enabled: the Android assets sync task
# and dependency-locking bootstrap are easier to reason about without it, and the
# cloud build is short enough that the win would be marginal.

org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official
kotlin.incremental=true
