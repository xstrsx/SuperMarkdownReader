<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="640" height="400" viewBox="0 0 640 400">
  <title>SVG 常用静态特性样例</title>
  <desc>渐变、蒙版、裁剪、滤镜、局部 use 引用、静态样式。</desc>

  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b6ea5"/>
      <stop offset="100%" stop-color="#8ab4f8"/>
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#2f7d52"/>
    </radialGradient>
    <clipPath id="clip">
      <circle cx="120" cy="120" r="70"/>
    </clipPath>
    <mask id="mask">
      <rect x="0" y="0" width="640" height="400" fill="black"/>
      <circle cx="420" cy="120" r="70" fill="white"/>
    </mask>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
    <g id="reusable">
      <rect x="0" y="0" width="40" height="40" rx="6" fill="url(#grad)" stroke="#1b1b1f"/>
      <text x="20" y="26" font-size="14" text-anchor="middle">re</text>
    </g>
    <style>
      .label { font-family: sans-serif; font-size: 13px; fill: #1b1b1f; }
      .accent { fill: #b3352c; }
    </style>
  </defs>

  <rect x="0" y="0" width="640" height="400" fill="#fbfbff"/>

  <circle cx="120" cy="120" r="80" fill="url(#radial)" stroke="#1b1b1f" stroke-width="2"/>
  <rect x="240" y="60" width="140" height="120" fill="url(#grad)" clip-path="url(#clip)"/>
  <rect x="330" y="40" width="200" height="160" fill="url(#grad)" mask="url(#mask)"/>
  <path d="M60 300 C 140 220, 220 380, 300 300 S 460 220, 540 300" fill="none"
        stroke="#7a4fa3" stroke-width="4" stroke-linecap="round" filter="url(#blur)"/>

  <use xlink:href="#reusable" x="40" y="230"/>
  <use href="#reusable" x="100" y="230"/>
  <use xlink:href="#reusable" x="160" y="230"/>

  <text x="320" y="360" class="label" text-anchor="middle">静态文本与局部引用</text>
  <text x="320" y="382" class="label accent" text-anchor="middle">accent 样式</text>

  <foreignObject x="380" y="240" width="220" height="80">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: sans-serif; font-size: 12px; color: #1b1b1f;">
      受控的 foreignObject 静态标签（应保留，但其中的脚本与外部引用会被移除）。
    </div>
  </foreignObject>
</svg>
